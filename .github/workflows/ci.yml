# CI gate for the CoreGym Coach Dashboard (app lives in coregym-coach-dashboard/).
# Runs on every push to main and every PR: typecheck → lint → production build.
# All three are blocking. Deployments stay on Vercel's GitHub integration;
# this workflow only gates what can be merged/pushed.

name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coregym-coach-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coregym-coach-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The merge gate. Keep this blocking.
      - name: Typecheck
        run: npx tsc --noEmit

# Blocking — repo-wide eslint is clean as of 2026-09-15 (static-components
# error in Sidebar.tsx hoisted out of render; unused vars/imports removed).
# Keep it blocking; any new lint error should fail CI.
      - name: Lint
        run: npm run lint

      # Build needs the public Supabase vars at bundle time (they are inlined
      # into client code). CI uses placeholders — the anon key is public by
      # design and all privileged access is server-side at runtime, so a real
      # key is never needed here and must NOT be added as a repo secret.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
